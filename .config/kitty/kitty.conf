# Font Configuration
font_size 12.0

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf

# Use fish
shell fish

###########################################################
# FONTS
###########################################################

# 1. Main Font: JetBrains Mono
# Note: You can usually just set the family, and Kitty finds the bold/italic automatically.
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# 2. Ligatures (The cool feature of JetBrains Mono)
# 'always' is default, but ensuring it's on doesn't hurt.
disable_ligatures never

# 3. Icon Map (Keep this!)
# This injects the Starship icons from the Symbols font you installed earlier
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d4,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f532,U+f0001-U+f1af0 Symbols Nerd Font Mono
